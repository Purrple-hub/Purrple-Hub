name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily
  workflow_dispatch:     # Allows you to manually run it

jobs:
  build:
    runs-on: ubuntu-latest
    # 🔥 CRITICAL FIX: Gives the bot permission to write to your repo
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Purrple-hub
          # These will be saved inside the 'dist' folder
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 🔥 Pushes the generated files to a branch called "output"
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
