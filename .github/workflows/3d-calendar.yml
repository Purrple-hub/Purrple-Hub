name: 3D Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Using "main" branch – this is the stable, working code
      - name: Generate 3D Profile
        uses: yoshi389111/github-profile-3d-contrib@main
        with:
          username: ''
          token: ''

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "Update 3D graph" || echo "No changes to commit"
          git push
